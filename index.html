<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#7F24F0;--indigo-bright:#7A2BD6;--pink:#FF5754;--sanbeam:#FF7C3A;
  --dusk-900:#FFF9F2;--dusk-700:#efe3d7;
  --ink:#2A114E;--ink-soft:#51406F;--ink-mute:#8C7FA6;--line:rgba(42,17,78,.14);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--dusk-900);color:var(--ink);font-family:var(--font);
  display:flex;flex-direction:column;justify-content:center;padding:8vh clamp(28px,8vw,140px);overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
.blob.b1{width:46vmax;height:46vmax;background:radial-gradient(circle,var(--indigo),transparent 70%);top:-20vmax;right:-14vmax;opacity:.14}
.blob.b2{width:34vmax;height:34vmax;background:radial-gradient(circle,var(--pink),transparent 70%);bottom:-16vmax;left:-12vmax;opacity:.13}
.wrap{position:relative;z-index:1;max-width:880px;width:100%;margin:0 auto}
.eyebrow{font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute);font-weight:600;margin-bottom:1.2rem}
h1{font-family:"Bricolage Grotesque","Inter",sans-serif;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.grad{background:linear-gradient(100deg,var(--sanbeam),var(--pink) 55%,var(--indigo-bright));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--ink-soft);font-size:1.15rem;margin-top:1rem;max-width:48ch;line-height:1.5}
.list{margin-top:3rem;display:flex;flex-direction:column;gap:1rem}
a.prez{display:flex;align-items:center;justify-content:space-between;gap:1rem;text-decoration:none;color:var(--ink);
  background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.6rem;transition:.25s;box-shadow:0 10px 30px -22px rgba(42,17,78,.45)}
a.prez:hover{transform:translateX(6px);border-color:var(--indigo-bright);background:rgba(255,255,255,.95)}
a.prez .t{font-size:1.3rem;font-weight:700}
a.prez .d{font-size:.95rem;color:var(--ink-mute);margin-top:.2rem}
a.prez .arrow{font-size:1.4rem;color:var(--sanbeam)}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <div class="eyebrow">Brycta · Platform Design</div>
  <h1>Presentations <span class="grad">·</span></h1>
  <p class="sub">A home for decks built with Claude. Pick one below.</p>
  <div class="list">
    <a class="prez" href="./buttons/">
      <div>
        <div class="t">The Buttons</div>
        <div class="d">Aperture Design System · 2026</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
</div>
</body>
</html>
