<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Présentations</title>
<style>
  :root { --bg: #0f1115; --fg: #f4f4f5; --muted: #9ca3af; --card: #1a1d24; --accent: #7c9cff; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 64px 16px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 32px; margin-bottom: 8px; }
  p.lead { color: var(--muted); margin-bottom: 40px; }
  ul { list-style: none; padding: 0; display: grid; gap: 12px; }
  a { display: block; background: var(--card); color: inherit; text-decoration: none; padding: 20px 24px; border-radius: 12px; border: 1px solid transparent; transition: border-color .2s; }
  a:hover { border-color: var(--accent); }
  a strong { display: block; font-size: 18px; }
  a span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Présentations</h1>
  <p class="lead">Chaque présentation vit dans son propre dossier.</p>
  <ul>
    <li><a href="buttons/"><strong>Buttons</strong><span>/buttons/</span></a></li>
  </ul>
</main>
</body>
</html>
